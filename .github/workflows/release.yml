# The release step: apply the migrations, and stop there.
#
# Deploying is a button somebody presses in the platform dashboard, on purpose.
# What is automated here is the half that must not be done by hand — applying
# the schema, from one place, with one credential, one run at a time.
#
# Migrate-then-boot still holds, and now it holds for a simpler reason. This
# runs on a push to `main`; the deploy that follows is a deliberate manual act
# afterwards. Nothing races because nothing else can deploy — there is no
# blueprint, no deploy hook, and no automatic deploy to get there first.
#
# The owner role is needed by this job and by nothing else, so it lives here and
# is absent from the deployed service altogether — not supplied and then
# stripped, but never supplied. The service holds no credential that can bypass
# row-level security because there is none in its environment to hold.
#
# One secret makes this run, and it is inert until that secret is set:
#
#   MIGRATE_DATABASE_URL   the owner role, over the direct (unpooled) endpoint
#
# Inert means skipped, not failed. A clone of this repository has no deployment
# and that is a supported state, on the same terms as every optional integration
# — absent configuration leaves a capability dormant rather than fatal. So the
# migration is gated on a job that reads the secret and reports whether there is
# a database to migrate at all, because the `secrets` context is not available
# in an `if:` and cannot gate anything directly.

name: Release

on:
  push:
    branches: [main]
  # Migrating a commit that is already on main, without pushing another one.
  workflow_dispatch:

# One migration at a time. Two overlapping runs would migrate the same database
# concurrently, which is the race that keeping migrations out of application
# boot was meant to avoid in the first place.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Is there a database to migrate? Its own job because that is the only shape
  # that can answer before anything effectful runs — the release job's `if:`
  # reads this output, so a repository with no secret skips entirely rather than
  # checking out, installing, and then declining.
  configured:
    runs-on: ubuntu-latest

    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Look for the release secret
        id: check
        env:
          # Read into the environment rather than interpolated into the script:
          # an expression expanded into shell puts the value in the command
          # line, where a quote in a connection string is a syntax error.
          MIGRATE: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          if [ -n "$MIGRATE" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No deployment configured. Set MIGRATE_DATABASE_URL to apply migrations; skipping.'
          fi

  release:
    needs: configured
    if: needs.configured.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` skips the `postinstall` generate, which needs a
      # schema this job never compiles against. The migrations are SQL and the
      # CLI applies them; no client is generated here.
      - run: npm ci --ignore-scripts

      # The same command local compose runs, against the deployed database.
      #
      # This job ends here. A failed migration leaves the running instance alone
      # against the schema it was built for, and a successful one leaves a
      # migrated database waiting for a deploy that a person triggers.
      - name: Apply migrations
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: npm run release
