# A clean clone runs with `docker compose up` and no credentials of any kind.
#
# Every value here is a throwaway local default. Nothing in this file is a real
# secret, and nothing real is ever committed — deployed environments inject
# their own values for the same variable names (see .env.example).
#
# Google and Slack are deliberately left unset: both integrations are dormant
# when unconfigured, which is what makes a key-free first run possible.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nivara_owner
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: nivara
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the non-BYPASSRLS `app_user` on first boot, so local development
      # exercises row-level security exactly as the deployed runtime does.
      # `z` relabels for SELinux hosts (Fedora, RHEL) and is ignored elsewhere;
      # without it the container cannot read the directory at all.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nivara_owner -d nivara']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Schema and seed, as their own short-lived step — the only place the owner
  # credential appears. It runs to completion and exits before `api` starts.
  migrate:
    build:
      context: .
      # The build stage still has the dev dependencies — the Prisma CLI and the
      # TypeScript seed live there, and stay out of the runtime image.
      target: build
    command: ['sh', '-c', 'npx prisma migrate deploy && npx prisma db seed']
    environment:
      # Owner role, direct (unpooled) connection. Creating tables and seeding
      # two tenants are both things every RLS policy would refuse, so this step
      # is meant to bypass them — and it is the only step that may.
      MIGRATE_DATABASE_URL: postgres://nivara_owner:local_dev_only@postgres:5432/nivara
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      # The least-privileged `app_user`, never the owner. MIGRATE_DATABASE_URL
      # is absent from this service on purpose: row-level security is only a
      # guarantee if the running process holds no credential that can bypass it.
      DATABASE_URL: postgres://app_user:local_dev_only@postgres:5432/nivara
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness only — deliberately dependency-free.
      test:
        ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
