# The deployed shape of the same artifact `docker compose up` runs locally.
#
# One web service, built from the repository `Dockerfile`, with the schema
# applied by a release step before the new instance takes traffic. Postgres
# (Neon) and Redis (Upstash) are managed elsewhere and reached by URL, so they
# are inputs here rather than services — which is also what lets the same image
# run locally against the compose Postgres with nothing swapped but variables.
#
# Nothing real is committed. Every secret below is `sync: false`, which means
# the blueprint declares that the variable exists and the value is supplied in
# the dashboard. A blueprint that carried values would be a credential in git.
#
# Platform glue only. The contract this implements — migrate-then-boot,
# environment-wired role split, liveness/readiness split, keep-warm, scheduler
# behind a flag — is framework- and platform-neutral; a port swaps this file
# and nothing else.

services:
  - type: web
    name: nivara-api
    runtime: docker
    plan: free
    region: oregon

    # Liveness, never readiness. The platform restarts an instance that fails
    # this, and readiness reports conditions that are emphatically not reasons
    # to restart: a database blip resolves itself, and a restart during one
    # loses the process that would have recovered. Readiness is for monitoring
    # and for routing, and it is polled by whatever watches the deployment.
    healthCheckPath: /health

    # The release step. It runs to completion before the new instance receives
    # traffic, and it is the same `npm run release` that local compose runs, so
    # local and deployed apply migrations by one command with one behaviour.
    #
    # Never at application boot: two instances booting together would race to
    # migrate the same database, and boot-time migration would require the owner
    # credential to be reachable from the long-running process — which is the
    # one thing the role split exists to prevent.
    #
    # **Known constraint.** Pre-deploy hooks are a paid-instance feature on this
    # platform, and the service above is on the free plan — so on the free tier
    # this line does not fire, and the release step has to be run by hand
    # against the same image before promoting the deploy:
    #
    #   docker run --rm -e MIGRATE_DATABASE_URL=… <image> npm run release
    #
    # That is the same command, in the same image, in the same order, which is
    # what makes it an equivalent trigger rather than a different procedure. The
    # ordering is the contract; the hook is only how it is triggered here, and
    # moving to a paid instance makes the trigger automatic with no other edit.
    preDeployCommand: npm run release

    envVars:
      - key: NODE_ENV
        value: production

      # The runtime credential: `app_user` — `NOSUPERUSER NOBYPASSRLS`, not the
      # table owner — over the *pooled* endpoint. The runtime needs no direct
      # connection at all, because tenant context is set transaction-locally
      # (`set_config(..., true)`) and is therefore safe under transaction-mode
      # pooling.
      - key: DATABASE_URL
        sync: false

      # The owner credential, over the *direct* (unpooled) endpoint, for the
      # release step above — migrations create tables, which every policy would
      # refuse and no pooler should hold open.
      #
      # It is set on the service because the pre-deploy hook runs in the
      # service's own environment; there is no narrower scope to give it. What
      # keeps it out of the running process is the image entrypoint, which
      # `env -u`s it before `exec`ing node — so the long-running process is
      # started with an environment that never contained it. The application
      # also refuses to boot in production if it ever finds one, which is the
      # backstop for the day this file is edited by someone who has not read the
      # Dockerfile.
      - key: MIGRATE_DATABASE_URL
        sync: false

      # Optional. Backs rate limiting and the cache, both of which fail open, so
      # an absent or unreachable Redis costs the deployment its ceilings and
      # nothing else — reported as `degraded` on /health/ready, never as a 503.
      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true
      # Deliberately a second generated value rather than a reuse of the first:
      # a widget session and a staff token are signed by different keys, so a
      # token minted for one surface fails to verify on the other at the
      # signature, before any claim is read.
      - key: WIDGET_SESSION_SECRET
        generateValue: true

      # The in-process ticker. On here because this is the only service; the
      # flag is what makes moving it to its own always-on worker a change to
      # this file rather than to the code — set `false` here, add a second
      # service with it `true`, and the split is done. Both on is safe too: the
      # drain claims with `SELECT … FOR UPDATE SKIP LOCKED` and the sweeps fire
      # on set-once predicates, so two runners never collide.
      - key: RUN_SCHEDULER
        value: true

      - key: SWAGGER_ENABLED
        value: true

      # The rate-limit ceilings, all per minute and all enforced only while
      # Redis is reachable. Stated here rather than left to the schema defaults
      # because they are the knobs an operator reaches for first, and a value
      # that exists only as a default in TypeScript is one nobody knows they are
      # allowed to change.
      - key: RATE_LIMIT_AUTHENTICATED_PER_MINUTE
        value: 300
      - key: RATE_LIMIT_SLACK_IP_PER_MINUTE
        value: 60
      - key: RATE_LIMIT_SLACK_GLOBAL_PER_MINUTE
        value: 600

      # Optional integrations. Declared so the variables are visible in the
      # dashboard, and left unset: both are dormant when unconfigured, so the
      # service comes up fully without them. Supplying one of a pair is what
      # fails at boot — absence is a choice, half-presence is a mistake.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
# Keep-warm is deliberately not in this file, because it cannot be: the ping has
# to come from outside the service it is keeping awake. An external monitor hits
# `/health` every 5 minutes — see `src/health/keep-warm.ts`, where that interval
# and the platform's idle window are constants with a test over the relationship
# between them.
